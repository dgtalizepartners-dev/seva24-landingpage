        <p class="support">

        </p>
    </footer>

    <script>
        const translatable = document.querySelectorAll('[data-en], [data-en-html]');

        function applyLanguage(lang) {
            translatable.forEach((el) => {
                if (el.hasAttribute('data-en-html')) {
                    el.innerHTML = lang === 'km' ? el.dataset.kmHtml : el.dataset.enHtml;
                } else {
                    el.textContent = lang === 'km' ? el.dataset.km : el.dataset.en;
                }
            });
        }

        const langButtons = document.querySelectorAll('.lang-switch button');

        function setLanguage(lang) {
            langButtons.forEach((b) => {
                const isActive = b.dataset.lang === lang;
                b.classList.toggle('active', isActive);
                b.setAttribute('aria-pressed', String(isActive));
            });
            document.documentElement.lang = lang;
            applyLanguage(lang);
            localStorage.setItem('seva24-lang', lang);
        }

        langButtons.forEach((btn) => {
            btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
        });

        const savedLang = localStorage.getItem('seva24-lang');
        if (savedLang) {
            setLanguage(savedLang);
        }

        function detectMobileOS() {
            const ua = navigator.userAgent || navigator.vendor || window.opera || '';
            if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return 'ios';
            if (/android/i.test(ua)) return 'android';
            return null;
        }

        const detectedOS = detectMobileOS();
        if (detectedOS) {
            document.querySelectorAll('.store-btn[data-store]').forEach((btn) => {
                if (btn.dataset.store !== detectedOS) {
                    btn.remove();
                }
            });
        }
    </script>

</body>

</html>
